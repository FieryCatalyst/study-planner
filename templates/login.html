<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0, minimum-scale=1.0">
    <meta name="format-detection" content="telephone=no">
    <meta name="theme-color" content="#667eea">
    <title>Smart Study Planner - Login</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        body {
            background: var(--bg-gradient);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow-x: hidden;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            -webkit-text-size-adjust: 100%;
            -ms-text-size-adjust: 100%;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        input {
            -webkit-appearance: none;
            -moz-appearance: none;
            appearance: none;
        }

        button {
            -webkit-appearance: none;
            -moz-appearance: none;
            appearance: none;
        }

        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 20% 50%, rgba(102, 126, 234, 0.2) 0%, transparent 50%),
                        radial-gradient(circle at 80% 20%, rgba(118, 75, 162, 0.2) 0%, transparent 50%),
                        radial-gradient(circle at 40% 80%, rgba(240, 147, 251, 0.2) 0%, transparent 50%);
            animation: float 6s ease-in-out infinite;
            z-index: -1;
        }

        .login-container {
            background: var(--bg-card);
            border-radius: var(--radius-xl);
            padding: 3rem;
            box-shadow: var(--shadow-xl);
            width: 100%;
            max-width: 450px;
            border: 1px solid var(--border-color);
            backdrop-filter: blur(10px);
            position: relative;
            overflow: hidden;
        }

        .login-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: var(--bg-gradient);
        }

        .login-header {
            text-align: center;
            margin-bottom: 2.5rem;
        }

        .login-header h1 {
            color: var(--text-primary);
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            background: var(--bg-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .login-header p {
            color: var(--text-secondary);
            font-size: 1.1rem;
        }

        .auth-tabs {
            display: flex;
            margin-bottom: 2rem;
            background: var(--bg-secondary);
            border-radius: var(--radius-lg);
            padding: 0.5rem;
        }

        .auth-tab {
            flex: 1;
            padding: 1rem;
            text-align: center;
            background: transparent;
            border: none;
            border-radius: var(--radius-md);
            cursor: pointer;
            transition: var(--transition);
            font-weight: 600;
            color: var(--text-secondary);
        }

        .auth-tab.active {
            background: var(--bg-gradient);
            color: white;
            box-shadow: var(--shadow-md);
        }

        .auth-form {
            display: none;
        }

        .auth-form.active {
            display: block;
        }

        .login-container .form-group {
            margin-bottom: 1.5rem;
            position: relative;
        }

        .login-container .form-group input[type="text"],
        .login-container .form-group input[type="password"],
        .login-container .form-group input[type="email"] {
            width: 100%;
            padding: 1.25rem 1.25rem 1.25rem 3.75rem !important;
            border: 2px solid var(--border-color);
            border-radius: var(--radius-lg);
            background: var(--bg-primary);
            color: var(--text-primary);
            font-size: 1rem;
            transition: var(--transition);
            box-sizing: border-box;
            line-height: 1.4;
            height: 3.5rem;
            display: flex;
            align-items: center;
            font-family: inherit;
            text-align: left;
        }

        .login-container .form-group input:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.1);
        }

        .login-container .form-group input::placeholder {
            color: var(--text-tertiary);
            opacity: 0.7;
            line-height: 1.4;
        }

        .login-container .form-group i {
            position: absolute;
            left: 1.375rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-tertiary);
            font-size: 1rem;
            pointer-events: none;
            z-index: 2;
            transition: var(--transition);
        }

        .login-container .form-group input:focus + i,
        .login-container .form-group:focus-within i {
            color: var(--primary-color);
        }

        .btn-login {
            width: 100%;
            padding: 1.25rem;
            background: var(--bg-gradient);
            color: white;
            border: none;
            border-radius: var(--radius-lg);
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            margin-bottom: 1.5rem;
            position: relative;
            overflow: hidden;
            height: 3.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .btn-login::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: var(--transition);
        }

        .btn-login:hover::before {
            left: 100%;
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-lg), var(--shadow-glow);
        }

        .divider {
            display: flex;
            align-items: center;
            margin: 2rem 0;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--border-color);
        }

        .divider span {
            padding: 0 1rem;
            color: var(--text-tertiary);
            font-size: 0.875rem;
        }

        .guest-login {
            text-align: center;
        }

        .btn-guest {
            background: transparent;
            color: var(--primary-color);
            border: 2px solid var(--primary-color);
            padding: 1rem 2rem;
            border-radius: var(--radius-lg);
            text-decoration: none;
            font-weight: 600;
            transition: var(--transition);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            height: 3.5rem;
            min-width: 200px;
        }

        .btn-guest:hover {
            background: var(--primary-color);
            color: white;
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
        }

        .theme-toggle-login {
            position: absolute;
            top: 1rem;
            right: 1rem;
            background: rgba(102, 126, 234, 0.1);
            border: none;
            border-radius: 50%;
            width: 3rem;
            height: 3rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition);
            color: var(--text-secondary);
        }

        .theme-toggle-login:hover {
            background: rgba(102, 126, 234, 0.2);
            transform: scale(1.1);
        }

        /* Enhanced Responsive Design for All Devices */
        
        /* Base styles already optimized for desktop */
        
        /* Large screens (1200px and up) */
        @media (min-width: 1200px) {
            .login-container {
                max-width: 500px;
                padding: 3.5rem;
            }
        }
        
        /* Medium to large tablets and small desktops (768px to 1199px) */
        @media (min-width: 768px) and (max-width: 1199px) {
            body {
                padding: 2rem 1rem;
            }
            
            .login-container {
                max-width: 450px;
                padding: 2.5rem;
                margin: 0 auto;
            }
            
            .login-header h1 {
                font-size: 2.25rem;
            }
        }
        
        /* Small tablets and large phones (481px to 767px) */
        @media (min-width: 481px) and (max-width: 767px) {
            body {
                padding: 1.5rem 1rem;
                align-items: flex-start;
                padding-top: 10vh;
            }
            
            .login-container {
                width: 100%;
                max-width: 400px;
                padding: 2rem 1.5rem;
                margin: 0 auto;
            }
            
            .login-header h1 {
                font-size: 2rem;
            }
            
            .login-header p {
                font-size: 1rem;
            }
            
            .login-container .form-group input {
                font-size: 16px !important;
                height: 3.25rem;
                padding: 1rem 1rem 1rem 3.5rem !important;
            }
            
            .login-container .form-group i {
                left: 1.25rem;
                font-size: 1rem;
            }
            
            .btn-login, .btn-guest {
                height: 3.25rem;
                font-size: 1rem;
            }
            
            .btn-guest {
                min-width: 200px;
            }
        }
        
        /* Mobile phones (320px to 480px) */
        @media (max-width: 480px) {
            body {
                padding: 1rem 0.75rem;
                align-items: flex-start;
                padding-top: 5vh;
                min-height: 100vh;
            }
            
            .login-container {
                width: 100%;
                max-width: 100%;
                padding: 1.5rem;
                margin: 0;
                border-radius: var(--radius-lg);
            }
            
            .login-header {
                margin-bottom: 1.75rem;
            }
            
            .login-header h1 {
                font-size: 1.75rem;
                margin-bottom: 0.5rem;
            }
            
            .login-header p {
                font-size: 0.95rem;
            }
            
            .auth-tabs {
                margin-bottom: 1.5rem;
                padding: 0.375rem;
            }
            
            .auth-tab {
                padding: 0.75rem 0.5rem;
                font-size: 0.9rem;
                min-height: 44px;
            }
            
            .login-container .form-group {
                margin-bottom: 1.25rem;
            }
            
            .login-container .form-group input[type="text"],
            .login-container .form-group input[type="password"],
            .login-container .form-group input[type="email"] {
                font-size: 16px !important; /* Prevents iOS zoom */
                height: 3rem;
                min-height: 44px;
                padding: 0.875rem 0.875rem 0.875rem 3.25rem !important;
                border-width: 1.5px;
            }
            
            .login-container .form-group i {
                left: 1.125rem;
                font-size: 0.9rem;
            }
            
            .btn-login {
                height: 3rem;
                min-height: 44px;
                font-size: 0.95rem;
                margin-bottom: 1.25rem;
            }
            
            .btn-guest {
                width: 100%;
                height: 3rem;
                min-height: 44px;
                font-size: 0.9rem;
                min-width: auto;
            }
            
            .divider {
                margin: 1.5rem 0;
            }
            
            .theme-toggle-login {
                top: 0.75rem;
                right: 0.75rem;
                width: 2.75rem;
                height: 2.75rem;
                min-height: 44px;
                min-width: 44px;
            }
        }
        
        /* Very small phones (less than 360px) */
        @media (max-width: 359px) {
            body {
                padding: 0.75rem 0.5rem;
                padding-top: 3vh;
            }
            
            .login-container {
                padding: 1.25rem;
            }
            
            .login-header h1 {
                font-size: 1.5rem;
            }
            
            .login-header p {
                font-size: 0.875rem;
            }
            
            .auth-tab {
                padding: 0.625rem 0.375rem;
                font-size: 0.85rem;
            }
            
            .login-container .form-group input {
                height: 2.75rem;
                padding: 0.75rem 0.75rem 0.75rem 3rem !important;
            }
            
            .login-container .form-group i {
                left: 1rem;
                font-size: 0.85rem;
            }
            
            .btn-login, .btn-guest {
                height: 2.75rem;
                font-size: 0.875rem;
            }
        }
        
        /* Landscape orientation for mobile */
        @media (max-height: 600px) and (orientation: landscape) and (max-width: 900px) {
            body {
                padding: 0.75rem;
                align-items: center;
                padding-top: 0;
            }
            
            .login-container {
                max-width: 450px;
                padding: 1.25rem 2rem;
                margin: 0 auto;
            }
            
            .login-header {
                margin-bottom: 1.25rem;
            }
            
            .login-header h1 {
                font-size: 1.5rem;
            }
            
            .login-header p {
                font-size: 0.875rem;
            }
            
            .auth-tabs {
                margin-bottom: 1rem;
            }
            
            .login-container .form-group {
                margin-bottom: 1rem;
            }
            
            .divider {
                margin: 1rem 0;
            }
        }
        
        /* Touch device optimizations */
        @media (hover: none) and (pointer: coarse) {
            /* Ensure touch targets are at least 44px */
            .auth-tab,
            .btn-login,
            .btn-guest,
            .theme-toggle-login {
                min-height: 44px;
                min-width: 44px;
            }
            
            .login-container .form-group input {
                min-height: 44px;
            }
            
            /* Slightly larger touch areas for better usability */
            .theme-toggle-login {
                width: 48px;
                height: 48px;
            }
        }
        
        /* High DPI display optimizations */
        @media (-webkit-min-device-pixel-ratio: 2), (min-resolution: 192dpi) {
            .login-container {
                border-width: 0.5px;
            }
            
            .login-container .form-group input {
                border-width: 1px;
            }
            
            .btn-guest {
                border-width: 1px;
            }
        }
        
        /* Print styles */
        @media print {
            body {
                background: white !important;
            }
            
            .login-container {
                box-shadow: none !important;
                border: 1px solid #ccc !important;
                background: white !important;
            }
            
            .theme-toggle-login {
                display: none !important;
            }
        }
        
        /* Reduce motion for accessibility */
        @media (prefers-reduced-motion: reduce) {
            * {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }
        
        /* High contrast mode support */
        @media (prefers-contrast: high) {
            .login-container .form-group input {
                border-width: 2px;
            }
            
            .btn-login, .btn-guest {
                border-width: 2px;
            }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <button class="theme-toggle-login" onclick="toggleTheme()">
            <i class="fas fa-moon"></i>
        </button>

        <div class="login-header">
            <h1><i class="fas fa-graduation-cap"></i> Study Planner</h1>
            <p>Your personal learning companion</p>
        </div>

        <div class="auth-tabs">
            <button class="auth-tab active" onclick="switchAuthTab('login')">Login</button>
            <button class="auth-tab" onclick="switchAuthTab('register')">Register</button>
        </div>

        <form class="auth-form active" id="login-form">
            <div class="form-group">
                <input type="text" id="login-username" placeholder="Username or Email" required>
                <i class="fas fa-user"></i>
            </div>
            <div class="form-group">
                <input type="password" id="login-password" placeholder="Password" required>
                <i class="fas fa-lock"></i>
            </div>
            <button type="submit" class="btn-login">
                <i class="fas fa-sign-in-alt"></i> Login
            </button>
        </form>

        <form class="auth-form" id="register-form">
            <div class="form-group">
                <input type="text" id="register-username" placeholder="Username" required>
                <i class="fas fa-user"></i>
            </div>
            <div class="form-group">
                <input type="email" id="register-email" placeholder="Email" required>
                <i class="fas fa-envelope"></i>
            </div>
            <div class="form-group">
                <input type="password" id="register-password" placeholder="Password" required>
                <i class="fas fa-lock"></i>
            </div>
            <div class="form-group">
                <input type="password" id="register-confirm" placeholder="Confirm Password" required>
                <i class="fas fa-lock"></i>
            </div>
            <button type="submit" class="btn-login">
                <i class="fas fa-user-plus"></i> Register
            </button>
        </form>

        <div class="divider">
            <span>OR</span>
        </div>

        <div class="guest-login">
            <a href="/guest" class="btn-guest">
                <i class="fas fa-user-secret"></i>
                Continue as Guest
            </a>
        </div>
    </div>

    <!-- Toast Container -->
    <div id="toast-container" class="toast-container"></div>

    <script>
        // Theme functionality
        function initializeTheme() {
            const savedTheme = localStorage.getItem('theme') || 'light';
            document.documentElement.setAttribute('data-theme', savedTheme);
            updateThemeIcon(savedTheme);
        }

        function toggleTheme() {
            const currentTheme = document.documentElement.getAttribute('data-theme');
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            
            document.documentElement.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
            updateThemeIcon(newTheme);
        }

        function updateThemeIcon(theme) {
            const icon = document.querySelector('.theme-toggle-login i');
            if (icon) {
                icon.className = theme === 'dark' ? 'fas fa-sun' : 'fas fa-moon';
            }
        }

        // Auth tab switching
        function switchAuthTab(tab) {
            // Update tab buttons
            document.querySelectorAll('.auth-tab').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            
            // Update forms
            document.querySelectorAll('.auth-form').forEach(form => form.classList.remove('active'));
            document.getElementById(`${tab}-form`).classList.add('active');
        }

        // Form submissions
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('login-username').value;
            const password = document.getElementById('login-password').value;
            
            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                
                const result = await response.json();
                
                if (result.success) {
                    showToast('🎉 Login successful!', 'success');
                    setTimeout(() => window.location.href = '/app', 1000);
                } else {
                    showToast('❌ ' + result.error, 'error');
                }
            } catch (error) {
                showToast('❌ Login failed: ' + error.message, 'error');
            }
        });

        document.getElementById('register-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('register-username').value;
            const email = document.getElementById('register-email').value;
            const password = document.getElementById('register-password').value;
            const confirm = document.getElementById('register-confirm').value;
            
            if (password !== confirm) {
                showToast('❌ Passwords do not match', 'error');
                return;
            }
            
            try {
                const response = await fetch('/api/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, email, password })
                });
                
                const result = await response.json();
                
                if (result.success) {
                    showToast('🎉 Registration successful!', 'success');
                    setTimeout(() => window.location.href = '/app', 1000);
                } else {
                    showToast('❌ ' + result.error, 'error');
                }
            } catch (error) {
                showToast('❌ Registration failed: ' + error.message, 'error');
            }
        });

        // Toast notifications
        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            if (!container) return;
            
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            
            const iconMap = {
                success: 'fas fa-check-circle',
                error: 'fas fa-exclamation-circle',
                warning: 'fas fa-exclamation-triangle'
            };
            
            toast.innerHTML = `
                <i class="toast-icon ${iconMap[type]}"></i>
                <div class="toast-message">${message}</div>
                <button class="toast-close" onclick="removeToast(this)">
                    <i class="fas fa-times"></i>
                </button>
            `;
            
            container.appendChild(toast);
            
            setTimeout(() => {
                if (toast.parentNode) {
                    removeToast(toast.querySelector('.toast-close'));
                }
            }, 5000);
        }

        function removeToast(button) {
            const toast = button.parentElement;
            toast.style.animation = 'slideOut 0.3s ease-in-out';
            setTimeout(() => {
                if (toast.parentNode) {
                    toast.parentNode.removeChild(toast);
                }
            }, 300);
        }

        // Initialize theme on page load
        initializeTheme();
    </script>
</body>
</html>
